# Starta: docker compose up -d
# Utan inloggning än: appen körs bara utan konto, och allt sparas i webbläsaren. Volymen används
# först när inloggningen slås på; då hamnar modellerna där, en mapp per användare (users/<id>/models, thumbs, trash).
services:
  bygg:
    build: .
    ports:
      - '8787:8787'
    environment:
      APP_URL: https://bygg.larsabrasha.com
      # Inloggning via Pocket ID: ta bort # på raderna nedan och lägg hemligheterna i .env (se README).
      # OIDC_ISSUER: https://id.larsabrasha.com
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?saknas i .env}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?saknas i .env}
      # SESSION_SECRET: ${SESSION_SECRET:?saknas i .env}
    volumes:
      - bygg-data:/data
    restart: unless-stopped

volumes:
  bygg-data:
