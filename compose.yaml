# Start or update: docker compose pull && docker compose up -d
# The image is built by GitHub Actions when a version tag is pushed (.github/workflows/image.yml).
# A specific version: BYGG_VERSION=1.2.3 in .env; otherwise latest.
# No sign-in yet: the app runs without accounts only, and everything is saved in the browser. The volume is used
# once sign-in is turned on; then the models end up there, one folder per user (users/<id>/models, thumbs, trash).
services:
  bygg:
    image: ghcr.io/larsabrasha/bygg:${BYGG_VERSION:-latest}
    ports:
      - '8787:8787'
    environment:
      APP_URL: https://bygg.larsabrasha.com
      # Sign-in via Pocket ID: remove the # on the lines below and put the secrets in .env (see README).
      # OIDC_ISSUER: https://id.larsabrasha.com
      # OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:?missing in .env}
      # OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?missing in .env}
      # SESSION_SECRET: ${SESSION_SECRET:?missing in .env}
    volumes:
      - bygg-data:/data
    restart: unless-stopped

volumes:
  bygg-data:
