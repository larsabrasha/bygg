<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <!-- maximum-scale: Safari zoomar annars in när ett fält med liten text får fokus. Nypzoom stoppas i usePreventPageZoom. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fbfaf8" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#24221f" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Rita möbler i 3D och få kaplistan, kapschemat och ritningen. I webbläsaren, på mobil och dator."
    />
    <!-- Förhandsvisningen när någon delar en länk. Bilden tas med npm run stills; servern gör
         adressen absolut med APP_URL (server/indexHtml.ts), som Facebook och LinkedIn kräver. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bygg" />
    <meta property="og:locale" content="sv_SE" />
    <meta property="og:title" content="Bygg – från skiss till kaplista" />
    <meta
      property="og:description"
      content="Rita möbler i 3D och få kaplistan, kapschemat och ritningen. I webbläsaren, på mobil och dator."
    />
    <meta property="og:image" content="/delningsbild.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Ett bord i ek och rubriken Från skiss till kaplista." />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <meta name="apple-mobile-web-app-title" content="Bygg" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Bygg</title>
    <script>
      // Temat före första bilden, så att sidan inte blinkar ljus när Mörkt är valt. Samma nyckel
      // och regel som src/theme.ts, som tar över när appen laddats.
      try {
        var t = localStorage.getItem('bygg.theme')
        if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        document.documentElement.dataset.theme = t
      } catch (e) {}
    </script>
    <style>
      /* Startbilden medan appen laddas: i #root, så att React byter ut den när den ritar första
         gången. Färgerna från index.css, med värdena som reserv: i dev laddas index.css av
         JavaScript, efter att startbilden visats. Tonas in först efter en stund, så att den
         inte blinkar till när appen laddas fort. */
      .splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: var(--color-canvas, #f2f1ee);
        color: var(--color-ink, #2a2724);
        font:
          14px system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        animation: splash-in 200ms ease-out 150ms both;
      }
      .splash p {
        margin: 0;
        color: var(--color-muted, #6b655c);
      }
      html[data-theme='dark'] .splash {
        background: var(--color-canvas, #1b1a18);
        color: var(--color-ink, #ebe7e0);
      }
      html[data-theme='dark'] .splash p {
        color: var(--color-muted, #a8a196);
      }
      @keyframes splash-in {
        from {
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <!-- wordmark: ordet Bygg som SVG, insatt av vite.config.ts (splashWordmark) -->
        <p>Laddar…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
